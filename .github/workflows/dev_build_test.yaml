name: Build and Test DEV
on:
  push:
    branches: [dev]
jobs:
  build_and_test_backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: cp configs/.env.dev.example configs/.env.dev

      - name: Build app
        run: docker compose --env-file .env.dev build

      - name: Test app
        run: docker compose --env-file .env.dev up user_service_test