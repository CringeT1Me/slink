name: Frontend Build and Test
on:
  push:
jobs:

  install_dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: ./slink_vue
        run: npm install ci

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        working-directory: ./slink_vue
        run: npm run build

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Test app
        working-directory: ./slink_vue
        run: npm run lint

